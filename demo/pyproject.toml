[project]
name = "totem-demo"
version = "0.1.0"
description = "Example agents instrumented with Totem"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "totem-ai",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv.sources]
totem-ai = { path = "../sdk/python", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
