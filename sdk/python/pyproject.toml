[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "totem-ai"
version = "0.1.0"
description = "Trace an AI agent's actions back through its memory to the source that caused them"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "opentelemetry-proto>=1.27",
]

[project.optional-dependencies]
# The LangGraph store wrapper and the callback handler need these; the
# explicit API does not.
langchain = [
    "langchain-core>=0.3",
    "langgraph>=0.2",
]

[dependency-groups]
dev = [
    "maturin>=1.7",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "langchain-core>=0.3",
    "langgraph>=0.2",
]

[tool.maturin]
manifest-path = "../core/Cargo.toml"
python-source = "src"
module-name = "totem_ai._core"
features = ["python"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
